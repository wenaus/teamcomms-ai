[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "teamcomms-ai"
version = "0.1.0.dev0"
description = "Distributed collaboration for humans, AI sessions, and systems"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "Torre Wenaus"}]
dependencies = [
    "Django>=5.2,<5.3",
    "mcp>=1.26,<2",
    "psycopg[binary]>=3.2,<4",
    "starlette>=0.46,<2",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-django>=4.9,<5", "httpx>=0.28,<1"]

[project.scripts]
teamcomms = "teamcomms.service.cli:main"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "teamcomms.service.settings"
testpaths = ["tests"]

[project.urls]
Repository = "https://github.com/wenaus/teamcomms-ai"
Design = "https://github.com/wenaus/teamcomms-ai/blob/main/docs/design.md"

[tool.setuptools.packages.find]
where = ["src"]
include = ["teamcomms*"]
namespaces = false
